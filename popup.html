<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>White Screen</title>
  <style>
    body {
      width: 600px;
      height: 100px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body>
  <!-- Table of Restricted URLS -->
  <table id="restrictedURL_table">
    <tr>
      <th>URL</th>
      <th>Opens</th>
      <th>Wait Time</th>
    </tr>
  </table>

  <br>

  <!-- Form for adding restricted URLS -->
  <form class="form-inline">
    <label for="URL">URL:</label>
    <input type="text" id="URL" placeholder="Website URL" name="URL">

    <label for="max_opens">Max Opens:</label>
    <input type="number" id="max_opens" placeholder="30" name="max_opens">

    <button type="submit">Submit</button>
  </form> 

  <!-- JavaScript -->
  <script src="popup.js"></script>
</body>
</html>
