<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="CSS/extension.css">
  <link rel="stylesheet" href="CSS/options.css">
  <title>Tranquil Options</title>
</head>
<body>
    <!-- Background -->
    <div id="extension_page_background">
        <!-- Heading Section -->
         <div class="header">
            <div id="groups_title" class="mintContainer">Groups</div>

            <!-- Button for creating a new group -->
            <button id="new_group_button" class="mintContainer" alt="New Group">+</button>

            <!-- Settings Button -->
            <button id="extension_settings_button" class="mintContainer" alt="Extension Settings">
                <img id="extension_settings_icon" src="Media/cog.png">
            </button>
        </div>

        <div id="options_page_bar" class="bar"></div>

        <div id="group_list">
            <!-- All restriction groups are displayed here -->
        </div>
    </div>

    <!-- Group Settings Popup -->
    <div id="group_settings_backdrop">
        <div id="group_settings_background_outer" class="ivoryContainer">
            <div id="group_settings_background_inner" class="sageContainer">
                <form id="group_settings"> 
                    <!-- Group Name -->
                    <div id="group_edit_header">
                        <h1 contenteditable id="settings_group_name">Group Name</h1>
                        <button id="group_save_button" class="mintContainer" data-edit-id="">Save</button>
                        <button id="group_delete_button" class="mintContainer">Delete</button>
                    </div>

                    <!-- Error Message -->
                    <p id="group_settings_error_message"></p>

                    <div id="settings_bar_1" class="bar"></div>
                    <!-- Days of the Week -->
                    <div id="group_edit_body">
                        <div id="days_of_the_week">
                            <div style="display:flex; flex-direction: column;">
                                <input id="sunday" type="checkbox" class="weekday" value="sunday">
                                <label class="weekday_label" for="sunday">Su</label>
                            </div>
                            
                            <div style="display:flex; flex-direction: column;">
                                <input id="monday" type="checkbox" class="weekday" value="monday">
                                <label class="weekday_label" for="monday">M</label>
                            </div>
                            
                            <div style="display:flex; flex-direction: column;">
                                <input id="tuesday" type="checkbox" class="weekday" value="tuesday">
                                <label class="weekday_label" for="tuesday">T</label>
                            </div>

                            <div style="display:flex; flex-direction: column;">
                                <input id="wednesday" type="checkbox" class="weekday" value="wednesday">
                                <label class="weekday_label" for="wednesday">W</label>
                            </div>

                            <div style="display:flex; flex-direction: column;">
                                <input id="thursday" type="checkbox" class="weekday" value="thursday">
                                <label class="weekday_label" for="thursday">Th</label>
                            </div>

                            <div style="display:flex; flex-direction: column;">
                                <input id="friday" type="checkbox" class="weekday" value="friday">
                                <label class="weekday_label" for="friday">F</label>
                            </div>

                            <div style="display:flex; flex-direction: column;">
                                <input id="saturday" type="checkbox" class="weekday" value="saturday">
                                <label class="weekday_label" for="saturday">Su</label>
                            </div>
                        </div>

                        <div id="edit_body">
                            <div id="edit_left">
                                <label>Start Time</label>
                                <input id="start_time" type="time">

                                <label>Pause Time</label>
                                <input id="pause_time" type="number">

                                <label>Opens</label>
                                <input id="opens" type="number">
                            </div>

                            <div id="edit_right">
                                <label>End Time</label>
                                <input id="end_time" type="time">

                                <label>Open Time</label>
                                <input id="open_time" type="number">
                            </div>
                        </div>
                    </div>

                    <div id="settings_bar_2" class="bar"></div>

                    <div id="group_edit_websites">
                        

                        <h1 id="websites_title">Websites</h1>
                        <span style="display: flex;">
                            <input type="text" id="new_url">
                            <button type="button" id="new_url_button" class="mintContainer">Save</button>
                        </span>
                        

                        <ul id="websites">
                            <!-- Websites go here, Delete button here(Lil trashcan) -->
                            
                        </ul>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Script File -->
    <script src="JavaScript/Restriction.js"></script>
    <script src="JavaScript/options.js"></script>
</body>
