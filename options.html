<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tranquil Options</title>
</head>
<body>
    <!-- Table of Restricted URLS -->
    <table id="restrictedURL_table">
        <tr>
            <th>URL</th>
            <th>Opens</th>
            <th>Wait Time</th>
            <th>Open Time</th>
        </tr>
    </table>

    <br>

    <!-- Form for adding restricted URLS -->
    <div>
        <form>
            <label for="URL">URL:</label>
            <input type="text" id="URL" placeholder="Website URL" name="URL">
            <br>

            <label for="max_opens">Max Opens:</label>
            <input type="number" id="max_opens" placeholder="4" name="max_opens">
            <br>

            <label for="wait_time">Max Opens:</label>
            <input type="number" id="wait_time" placeholder="30" name="wait_time">
            <br>

            <label for="open_time">Max Opens:</label>
            <input type="number" step=.01 id="open_time" placeholder="60" name="open_time">
            <br>

            <button id="submit" type="submit">Submit</button>
        </form>
    </div> 

    <!-- Script File -->
    <script src="JavaScript/options.js"></script>
</body>
