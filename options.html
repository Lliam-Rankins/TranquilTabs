<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tranquil Options</title>
</head>
<body>
    <!-- Background -->
    <div id="options_page_background">
        <!-- Heading Section -->
        <div id="groups_title_background">
            <h1 id="groups_title">Groups</h1>
        </div>

        <!-- Button for creating a new group -->
        <button id="new_group_button">+</button>

        <!-- Settings Button -->
        <img src="Media/cog.png">

        <div id="options_page_bar" class="bar"></div>

        <div id="group_grid">
            <!-- All restriction groups are displayed here -->
        </div>
    </div>

    <!-- Group Settings Popup -->
    <div id="group_settings_background_outer">
        <div id="group_settings_background_inner">
            <form id="group_settings"> 
                <!-- Group Name -->
                <h1 id="settings_group_name">Group Name</h1>
                <button type="submit">Save</button>

                <div id="settings_bar_1" class="bar"></div>
                <!-- Days of the Week -->
                <div id="days_of_the_week">
                    <input type="checkbox" class="weekday_box">
                    <label class="weekday">Su</label>
                    
                    <input type="checkbox" class="weekday_box">
                    <label class="weekday">M</label>

                    <input type="checkbox" class="weekday_box">
                    <label class="weekday">T</label>

                    <input type="checkbox" class="weekday_box">
                    <label class="weekday">W</label>

                    <input type="checkbox" class="weekday_box">
                    <label class="weekday">Th</label>

                    <input type="checkbox" class="weekday_box">
                    <label class="weekday">F</label>

                    <input type="checkbox" class="weekday">
                    <label class="weekday">S</label>
                </div>

                <label>Start Time</label>
                <input id="start_time" type="time">

                <label>End Time</label>
                <input id="end_time" type="time">

                <!-- TODO, implement 24h -->

                <label>Pause Time</label>
                <input id="pause_time" type="number">

                <label>Open Time</label>
                <input id="open_time" type="number">

                <label>Opens</label>
                <input id="opens" type="number">

                <div id="settings_bar_2" class="bar"></div>

                <h1 id="websites_title">Websites</h1>
                <div id="websites">
                    <!-- Websites go here -->
                </div>
            </form>
        </div>
    </div>

    <!-- Script File -->
    <script src="JavaScript/options.js"></script>
    <script src="JavaScript/Restriction.js"></script>
</body>
